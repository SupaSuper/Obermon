name: Build and Benchmark Obermon Windows

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Independent Speedometer samples per mode
        required: false
        default: '3'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - 'benchmarks/**'
      - '.github/workflows/windows-self-hosted.yml'

permissions:
  contents: read

concurrency:
  group: obermon-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-benchmark:
    runs-on: [self-hosted, Windows, X64, obermon-builder]
    timeout-minutes: 900
    env:
      OBERMON_WORK_ROOT: C:\ObermonBuild
      OBERMON_BENCHMARK_RESULTS: C:\ObermonBuild\benchmark-results
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require an interactive benchmark desktop
        shell: pwsh
        run: |
          if (-not [Environment]::UserInteractive) {
            throw 'The self-hosted runner is not attached to an interactive Windows desktop.'
          }
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) {
            throw 'Windows Explorer is not running. Log into and unlock the benchmark runner before starting this workflow.'
          }

      - name: Bootstrap pinned sources
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -WorkRoot $env:OBERMON_WORK_ROOT

      - name: Build Obermon
        shell: pwsh
        run: ./scripts/build.ps1 -WorkRoot $env:OBERMON_WORK_ROOT

      - name: Run source and browser tests
        shell: pwsh
        run: ./scripts/test.ps1 -WorkRoot $env:OBERMON_WORK_ROOT

      - name: Install benchmark automation
        shell: pwsh
        run: npm install --prefix benchmarks --ignore-scripts --no-audit --no-fund

      - name: Run BrowserBench Speedometer 3.1
        shell: pwsh
        run: |
          $Runs = '${{ inputs.runs }}'
          if ([string]::IsNullOrWhiteSpace($Runs)) { $Runs = '3' }
          Remove-Item $env:OBERMON_BENCHMARK_RESULTS -Recurse -Force -ErrorAction SilentlyContinue
          node benchmarks/run-speedometer.mjs `
            --browser "$env:OBERMON_WORK_ROOT\chromium\src\out\ObermonRelease\chrome.exe" `
            --output $env:OBERMON_BENCHMARK_RESULTS `
            --runs $Runs
          Get-Content "$env:OBERMON_BENCHMARK_RESULTS\REPORT.md" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Package browser
        shell: pwsh
        run: ./scripts/package.ps1 -WorkRoot $env:OBERMON_WORK_ROOT

      - name: Upload Speedometer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Obermon-Speedometer-3.1
          path: C:\ObermonBuild\benchmark-results
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Obermon Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Obermon-Windows-x64
          path: C:\ObermonBuild\dist\Obermon-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
